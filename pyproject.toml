[project]
name = "jspace"
version = "0.1.0"
description = "Reproducing and extending 'Verbalizable Representations Form a Global Workspace in Language Models' (Gurnee et al., 2026) on open-weights models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
    "torch>=2.8",
    "transformers>=5.5",
    "accelerate",
    "huggingface_hub",
    "datasets",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    # Anthropic's reference implementation of the Jacobian lens, pinned.
    "jlens @ git+https://github.com/anthropics/jacobian-lens@581d398613e5602a5af361e1c34d3a92ea82ba8e",
    "flash-linear-attention>=0.5.2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jspace"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]
